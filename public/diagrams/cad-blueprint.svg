<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <pattern id="blueGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
    <marker id="dimArrowStart" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M 6 0 L 0 3 L 6 6 Z" fill="#00f0ff"/>
    </marker>
    <marker id="dimArrowEnd" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 Z" fill="#00f0ff"/>
    </marker>
  </defs>

  <!-- Deep Blue CAD Blueprint Background -->
  <rect width="800" height="400" fill="#080c14"/>
  <rect width="800" height="400" fill="url(#blueGrid)"/>

  <!-- Border Blueprint Frame -->
  <rect x="20" y="20" width="760" height="360" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.4"/>

  <!-- ================= LEFT: FRONT VIEW (100mm Diameter) ================= -->
  <g transform="translate(220, 190)">
    <!-- Centerlines -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="8,4,2,4" stroke-opacity="0.5"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="8,4,2,4" stroke-opacity="0.5"/>

    <!-- Outer Pod Body -->
    <circle cx="0" cy="0" r="90" fill="#0f172a" stroke="#00f0ff" stroke-width="2"/>
    <!-- Outer Bezel Ring -->
    <circle cx="0" cy="0" r="82" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
    <!-- Optical Lens Chamfer -->
    <circle cx="0" cy="0" r="72" fill="#030712" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- 9-Emitter Optical Cluster Layout -->
    <!-- Center Emitter -->
    <circle cx="0" cy="0" r="14" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="-6" y="-6" width="12" height="12" fill="#fbbf24" rx="2"/>

    <!-- 8 Outer Emitters Ring -->
    <!-- Top / Bottom / Left / Right -->
    <g stroke="#00f0ff" stroke-width="1.2" fill="none">
      <circle cx="0" cy="-45" r="12" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
      <rect x="-5" y="-50" width="10" height="10" fill="#fbbf24" rx="1.5"/>

      <circle cx="0" cy="45" r="12" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
      <rect x="-5" y="40" width="10" height="10" fill="#fbbf24" rx="1.5"/>

      <circle cx="-45" cy="0" r="12" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
      <rect x="-50" y="-5" width="10" height="10" fill="#fbbf24" rx="1.5"/>

      <circle cx="45" cy="0" r="12" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
      <rect x="40" y="-5" width="10" height="10" fill="#fbbf24" rx="1.5"/>

      <!-- Diagonal Emitters -->
      <circle cx="-32" cy="-32" r="12" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
      <rect x="-37" y="-37" width="10" height="10" fill="#fbbf24" rx="1.5"/>

      <circle cx="32" cy="-32" r="12" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
      <rect x="27" y="-37" width="10" height="10" fill="#fbbf24" rx="1.5"/>

      <circle cx="-32" cy="32" r="12" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
      <rect x="-37" y="27" width="10" height="10" fill="#fbbf24" rx="1.5"/>

      <circle cx="32" cy="32" r="12" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24"/>
      <rect x="27" y="27" width="10" height="10" fill="#fbbf24" rx="1.5"/>
    </g>

    <!-- Diameter Dimension Callout -->
    <line x1="-90" y1="105" x2="90" y2="105" stroke="#00f0ff" stroke-width="1.2" marker-start="url(#dimArrowStart)" marker-end="url(#dimArrowEnd)"/>
    <line x1="-90" y1="92" x2="-90" y2="115" stroke="#00f0ff" stroke-width="0.8"/>
    <line x1="90" y1="92" x2="90" y2="115" stroke="#00f0ff" stroke-width="0.8"/>
    <text x="0" y="125" fill="#00f0ff" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">⌀ 100.0 mm</text>
    <text x="0" y="145" fill="#9ca3af" font-family="monospace" font-size="10" text-anchor="middle">FRONT ELEVATION</text>
  </g>

  <!-- ================= RIGHT: SIDE PROFILE VIEW (65mm Depth) ================= -->
  <g transform="translate(560, 190)">
    <!-- Centerline -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="8,4,2,4" stroke-opacity="0.5"/>

    <!-- Housing Side Profile Shape -->
    <!-- Front Bezel -->
    <rect x="-60" y="-90" width="15" height="180" rx="3" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Polycarbonate Lens Curve -->
    <path d="M -60 -80 Q -72 0 -60 80" fill="none" stroke="#38bdf8" stroke-width="2"/>

    <!-- Main Radiator Body with Cooling Fins -->
    <rect x="-45" y="-85" width="60" height="170" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1.8"/>
    <!-- Cooling Fins -->
    <line x1="-30" y1="-85" x2="-30" y2="85" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="-15" y1="-85" x2="-15" y2="85" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.7"/>
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- Rear Wire Gland Exit -->
    <rect x="15" y="-12" width="16" height="24" rx="2" fill="#334155" stroke="#00f0ff" stroke-width="1.2"/>
    <path d="M 31 0 L 55 0" stroke="#ef4444" stroke-width="3"/>

    <!-- Bottom Mounting Pivot Stud -->
    <rect x="-25" y="85" width="20" height="25" fill="#1e293b" stroke="#00f0ff" stroke-width="1.2"/>
    <circle cx="-15" cy="98" r="4" fill="#080c14" stroke="#00f0ff" stroke-width="1.2"/>
    <line x1="-15" y1="110" x2="-15" y2="135" stroke="#9ca3af" stroke-width="3"/>

    <!-- Depth Dimension Callout -->
    <line x1="-60" y1="-105" x2="15" y2="-105" stroke="#00f0ff" stroke-width="1.2" marker-start="url(#dimArrowStart)" marker-end="url(#dimArrowEnd)"/>
    <line x1="-60" y1="-95" x2="-60" y2="-115" stroke="#00f0ff" stroke-width="0.8"/>
    <line x1="15" y1="-95" x2="15" y2="-115" stroke="#00f0ff" stroke-width="0.8"/>
    <text x="-22" y="-115" fill="#00f0ff" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">65.0 mm</text>

    <!-- Total Height Dimension (including mount) -->
    <line x1="60" y1="-90" x2="60" y2="135" stroke="#00f0ff" stroke-width="1.2" marker-start="url(#dimArrowStart)" marker-end="url(#dimArrowEnd)"/>
    <line x1="20" y1="-90" x2="70" y2="-90" stroke="#00f0ff" stroke-width="0.8"/>
    <line x1="-10" y1="135" x2="70" y2="135" stroke="#00f0ff" stroke-width="0.8"/>
    <text x="75" y="25" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">115.0 mm</text>
    <text x="-20" y="155" fill="#9ca3af" font-family="monospace" font-size="10" text-anchor="middle">SIDE PROFILE</text>
  </g>

  <!-- Title Block Header -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">MADDOG ENGINEERING BLUEPRINT · CAD-DIM-2026</text>
    <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="10">SCALE 1:1 · TOLERANCE ±0.05mm · BILLET AL 6063-T6</text>
  </g>
</svg>
