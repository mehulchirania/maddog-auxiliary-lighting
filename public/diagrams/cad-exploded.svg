<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1f2937" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Dark CAD Background Grid -->
  <rect width="1000" height="500" fill="#090a0f"/>
  <rect width="1000" height="500" fill="url(#cadGrid)"/>

  <!-- Center Axis Line -->
  <line x1="50" y1="250" x2="950" y2="250" stroke="#00f0ff" stroke-width="1" stroke-dasharray="8,4,2,4" stroke-opacity="0.4"/>

  <!-- Sub-Assembly 1: Front Bezel (CNC Aluminium) -->
  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="40" height="180" rx="6" fill="#111827" stroke="#00f0ff" stroke-width="1.8"/>
    <line x1="20" y1="10" x2="20" y2="170" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="20" cy="30" r="4" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="20" cy="150" r="4" fill="none" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Label -->
    <path d="M 20 0 L 20 -40 L -20 -40" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="-25" y="-36" fill="#9ca3af" font-family="monospace" font-size="11" text-anchor="end">01 / CNC BEZEL (6063-T6)</text>
  </g>

  <!-- Sub-Assembly 2: IP-67 Fluorosilicone O-Ring Gasket -->
  <g transform="translate(190, 175)">
    <rect x="0" y="0" width="16" height="150" rx="8" fill="#ff3b30" fill-opacity="0.2" stroke="#ff3b30" stroke-width="2"/>
    <!-- Label -->
    <path d="M 8 150 L 8 210 L -20 210" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="-25" y="214" fill="#ff3b30" font-family="monospace" font-size="11" text-anchor="end">02 / IP-67 SILICONE GASKET</text>
  </g>

  <!-- Sub-Assembly 3: Bayer Optical Polycarbonate Collimator Lens -->
  <g transform="translate(260, 170)">
    <path d="M 0 10 Q 30 80 0 150 L 35 150 Q 65 80 35 10 Z" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="25" cy="45" r="10" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="25" cy="80" r="12" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="25" cy="115" r="10" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Label -->
    <path d="M 30 10 L 30 -50 L 80 -50" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="85" y="-46" fill="#00f0ff" font-family="monospace" font-size="11">03 / TIR COLLIMATOR OPTICS (96% TRANSMITTANCE)</text>
  </g>

  <!-- Sub-Assembly 4: Multi-Emitter Nichia LED MCPCB -->
  <g transform="translate(420, 175)">
    <rect x="0" y="0" width="25" height="150" rx="3" fill="#1f2937" stroke="#fbbf24" stroke-width="1.8"/>
    <!-- Emitter dies -->
    <rect x="6" y="25" width="12" height="12" fill="#fbbf24" rx="2"/>
    <rect x="6" y="50" width="12" height="12" fill="#fbbf24" rx="2"/>
    <rect x="6" y="75" width="12" height="12" fill="#fbbf24" rx="2"/>
    <rect x="6" y="100" width="12" height="12" fill="#fbbf24" rx="2"/>
    <rect x="6" y="125" width="12" height="12" fill="#fbbf24" rx="2"/>
    <!-- Label -->
    <path d="M 12 0 L 12 -70 L 60 -70" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="65" y="-66" fill="#fbbf24" font-family="monospace" font-size="11">04 / NICHIA AUTOMOTIVE LED ARRAY (JAPAN)</text>
  </g>

  <!-- Sub-Assembly 5: Copper Phase Thermal Interface Pad -->
  <g transform="translate(500, 185)">
    <rect x="0" y="0" width="12" height="130" rx="2" fill="#f97316" fill-opacity="0.3" stroke="#f97316" stroke-width="1.5"/>
    <!-- Label -->
    <path d="M 6 130 L 6 190 L 50 190" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="55" y="194" fill="#f97316" font-family="monospace" font-size="11">05 / THERMAL PHASE INTERFACE (4.8 W/m·K)</text>
  </g>

  <!-- Sub-Assembly 6: Aero-Fin Radiator Heat-Sink Housing -->
  <g transform="translate(570, 150)">
    <rect x="0" y="0" width="90" height="200" rx="10" fill="#111827" stroke="#00f0ff" stroke-width="2"/>
    <!-- Fins -->
    <line x1="20" y1="0" x2="20" y2="200" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="40" y1="0" x2="40" y2="200" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="60" y1="0" x2="60" y2="200" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
    <line x1="80" y1="0" x2="80" y2="200" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Label -->
    <path d="M 45 0 L 45 -40 L 90 -40" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="95" y="-36" fill="#00f0ff" font-family="monospace" font-size="11">06 / DIE-CAST AERO-COOLING RADIATOR HOUSING</text>
  </g>

  <!-- Sub-Assembly 7: Sealed IP-68 Cable Gland & Harness -->
  <g transform="translate(710, 230)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="#374151" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M 40 20 C 70 20 80 80 120 80" fill="none" stroke="#ef4444" stroke-width="4"/>
    <path d="M 40 20 C 70 20 80 90 120 90" fill="none" stroke="#111827" stroke-width="4"/>
    <!-- Label -->
    <path d="M 20 40 L 20 120 L 70 120" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="75" y="124" fill="#9ca3af" font-family="monospace" font-size="11">07 / MOISTURE-LOCK IP-68 CABLE GLAND</text>
  </g>

  <!-- Sub-Assembly 8: Grade 8.8 Stainless Steel Pivot Bracket -->
  <g transform="translate(600, 360)">
    <path d="M -20 0 L 50 0 L 60 40 L -30 40 Z" fill="#1f2937" stroke="#00f0ff" stroke-width="1.5"/>
    <circle cx="15" cy="20" r="7" fill="#090a0f" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Label -->
    <path d="M 15 40 L 15 80 L -20 80" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="-25" y="84" fill="#00f0ff" font-family="monospace" font-size="11" text-anchor="end">08 / 316 STAINLESS STEEL BRACKET</text>
  </g>

  <!-- Exploded Flow Dimension Arrows -->
  <g stroke="#00f0ff" stroke-width="1.5" fill="none" stroke-opacity="0.8">
    <path d="M 145 250 L 180 250"/>
    <path d="M 215 250 L 250 250"/>
    <path d="M 365 250 L 410 250"/>
    <path d="M 455 250 L 490 250"/>
    <path d="M 520 250 L 560 250"/>
    <path d="M 670 250 L 700 250"/>
  </g>

  <!-- Corner Engineering Telemetry Stamp -->
  <g transform="translate(820, 30)">
    <rect x="0" y="0" width="150" height="60" fill="#111827" fill-opacity="0.9" stroke="#00f0ff" stroke-width="1" rx="4"/>
    <text x="10" y="20" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">MADDOG CAD-LABS</text>
    <text x="10" y="36" fill="#9ca3af" font-family="monospace" font-size="9">SCHEMATIC: EXPLODED-9</text>
    <text x="10" y="50" fill="#22c55e" font-family="monospace" font-size="9">STATUS: CERTIFIED IP-67</text>
  </g>
</svg>
